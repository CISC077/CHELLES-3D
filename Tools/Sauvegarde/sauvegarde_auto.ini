; CHELLES 3D - reglages de la SAUVEGARDE AUTOMATIQUE avant chaque script
; (lu par sauvegarde_auto.py ; modifiable avec le Bloc-notes)

; 1 = active, 0 = coupee
Actif=1

; nombre de photos gardees (les plus anciennes sont effacees toutes seules)
Garder=5

; pas de nouvelle photo si la derniere a moins de X minutes
; (un script qui en lance un autre ne fait qu'une seule photo)
Delai_minutes=3

; scripts qui ne font que LIRE le projet : pas de photo pour eux
Exclure=analyse_contenu,analyse_menage,analyser_habillage,inventaire_rendu,verifier_erreurs,diagnostic_decor,controler_campagne,captures_campagne,habillage_commun,generer_audit
